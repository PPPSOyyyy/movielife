<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>로그인 | MovieLife</title>


    <style>

        /* ==================================================
           기본 설정
        ================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        :root {
            --black: #000000;
            --red: #D92234;
            --white: #ffffff;
            --gray-300: #cccccc;
            --gray-500: #777777;
            --gray-700: #333333;
        }


        html {
            height: 100%;
        }


        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% 20%,
                    rgba(217, 34, 52, 0.12),
                    transparent 35%
                ),
                #000000;

            color: white;

            font-family:
                "Pretendard",
                "Noto Sans KR",
                Arial,
                sans-serif;

        }


        a {
            color: inherit;
            text-decoration: none;
        }


        button,
        input {
            font-family: inherit;
        }


        button {
            cursor: pointer;
        }



        /* ==================================================
           HEADER
        ================================================== */

        .header {

            width: 100%;

            height: 76px;

            display: flex;

            align-items: center;

            padding: 0 6%;

            border-bottom:
                1px solid rgba(255,255,255,0.07);

            background:
                rgba(0,0,0,0.92);

        }


        /* 로고 */

        .logo {

            display: flex;

            align-items: center;

            width: 145px;

        }


        .logo img {

            display: block;

            width: 145px;

            height: auto;

        }


        /* 메인으로 */

        .header-right {

            margin-left: auto;

        }


        .back-home {

            color: #888;

            font-size: 13px;

            transition: 0.2s;

        }


        .back-home:hover {

            color: white;

        }



        /* ==================================================
           로그인 전체 영역
        ================================================== */

        .login-container {

            min-height:
                calc(100vh - 76px);

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 70px 20px;

        }


        .login-wrapper {

            width: 100%;

            max-width: 470px;

        }



        /* ==================================================
           제목
        ================================================== */

        .login-title {

            text-align: center;

            margin-bottom: 35px;

        }


        .login-title .small-title {

            color: var(--red);

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 2px;

            margin-bottom: 12px;

        }


        .login-title h1 {

            font-size: 32px;

            letter-spacing: -2px;

            margin-bottom: 9px;

        }


        .login-title p {

            color: #777;

            font-size: 13px;

        }



        /* ==================================================
           로그인 카드
        ================================================== */

        .login-card {

            padding: 38px;

            border:
                1px solid #252525;

            border-radius: 8px;

            background:
                rgba(16,16,16,0.95);

            box-shadow:
                0 30px 80px
                rgba(0,0,0,0.5);

        }



        /* ==================================================
           입력 영역
        ================================================== */

        .input-group {

            margin-bottom: 20px;

        }


        .input-group label {

            display: block;

            margin-bottom: 8px;

            color: #d0d0d0;

            font-size: 12px;

            font-weight: 600;

        }


        input {

            width: 100%;

            height: 48px;

            padding: 0 14px;

            outline: none;

            border:
                1px solid #333;

            border-radius: 5px;

            background: #080808;

            color: white;

            font-size: 13px;

            transition: 0.2s;

        }


        input::placeholder {

            color: #555;

        }


        input:focus {

            border-color:
                var(--red);

            background: #0c0c0c;

            box-shadow:
                0 0 0 2px
                rgba(217,34,52,0.08);

        }



        /* ==================================================
           로그인 옵션
        ================================================== */

        .login-options {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-top: 5px;

            margin-bottom: 25px;

        }


        /* 아이디 저장 */

        .remember-id {

            display: flex;

            align-items: center;

            gap: 7px;

            color: #777;

            font-size: 11px;

            cursor: pointer;

        }


        .remember-id input {

            width: 15px;

            height: 15px;

            accent-color: var(--red);

        }


        /* 아이디/비밀번호 찾기 */

        .find-account {

            display: flex;

            gap: 8px;

            color: #666;

            font-size: 11px;

        }


        .find-account a:hover {

            color: white;

        }


        .find-account .divider {

            color: #333;

        }



        /* ==================================================
           로그인 버튼
        ================================================== */

        .login-button {

            width: 100%;

            height: 52px;

            border: none;

            border-radius: 5px;

            background:
                var(--red);

            color: white;

            font-size: 14px;

            font-weight: 700;

            transition: 0.25s;

        }


        .login-button:hover {

            background: #ed3043;

            transform:
                translateY(-2px);

            box-shadow:
                0 10px 30px
                rgba(217,34,52,0.25);

        }



        /* ==================================================
           회원가입
        ================================================== */

        .signup-link {

            text-align: center;

            margin-top: 23px;

            padding-top: 23px;

            border-top:
                1px solid #222;

            color: #666;

            font-size: 12px;

        }


        .signup-link a {

            margin-left: 5px;

            color: white;

            font-weight: 600;

        }


        .signup-link a:hover {

            color: var(--red);

        }



        /* ==================================================
           FOOTER
        ================================================== */

        .footer {

            padding: 25px 6%;

            border-top:
                1px solid #181818;

            text-align: center;

            color: #444;

            font-size: 10px;

        }



        /* ==================================================
           MOBILE
        ================================================== */

        @media (max-width: 600px) {


            .header {

                height: 68px;

                padding: 0 20px;

            }


            .logo {

                width: 125px;

            }


            .logo img {

                width: 125px;

            }


            .login-container {

                padding:
                    50px 15px;

            }


            .login-card {

                padding:
                    28px 20px;

            }


            .login-title h1 {

                font-size: 28px;

            }


            .login-options {

                align-items: flex-start;

                flex-direction: column;

                gap: 12px;

            }

        }

    </style>

</head>



<body>


<!-- ==================================================
     HEADER
================================================== -->

<header class="header">


    <!-- movieLife 로고 -->

    <a
        href="movielife.html"
        class="logo"
    >

        <img
            src="images/logo.png"
            alt="movieLife"
        >

    </a>


    <!-- 메인으로 -->

    <div class="header-right">

        <a
            href="movielife.html"
            class="back-home"
        >

            ← 메인으로

        </a>

    </div>


</header>



<!-- ==================================================
     LOGIN
================================================== -->

<main class="login-container">


    <div class="login-wrapper">


        <!-- 제목 -->

        <div class="login-title">

            <div class="small-title">

                MY MOVIE, MY LIFE

            </div>


            <h1>

                로그인

            </h1>


            <p>

                MovieLife에서
                나만의 영화 이야기를 만나보세요.

            </p>

        </div>



        <!-- 로그인 카드 -->

        <div class="login-card">


            <!-- ==========================================
                 아이디
            =========================================== -->

            <div class="input-group">

                <label for="userId">

                    아이디

                </label>


                <input
                    type="text"
                    id="userId"
                    name="userId"
                    placeholder="아이디를 입력해주세요."
                >

            </div>



            <!-- ==========================================
                 비밀번호
            =========================================== -->

            <div class="input-group">

                <label for="password">

                    비밀번호

                </label>


                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="비밀번호를 입력해주세요."
                >

            </div>



            <!-- ==========================================
                 로그인 옵션
            =========================================== -->

            <div class="login-options">


                <label class="remember-id">

                    <input
                        type="checkbox"
                        id="rememberId"
                    >

                    아이디 저장

                </label>



                <div class="find-account">

                    <a href="#">
                        아이디 찾기
                    </a>

                    <span class="divider">
                        |
                    </span>

                    <a href="#">
                        비밀번호 찾기
                    </a>

                </div>


            </div>



            <!-- ==========================================
                 로그인 버튼
            =========================================== -->

            <button
                type="button"
                class="login-button"
            >

                로그인

            </button>



            <!-- ==========================================
                 회원가입
            =========================================== -->

            <div class="signup-link">

                아직 회원이 아니신가요?

                <a href="signup.html">

                    회원가입

                </a>

            </div>


        </div>


    </div>


</main>



<!-- ==================================================
     FOOTER
================================================== -->

<footer class="footer">

    © 2026 movieLife. All Rights Reserved.

</footer>



</body>

</html>
