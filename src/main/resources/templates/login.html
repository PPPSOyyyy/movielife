<!DOCTYPE html>

<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>로그인 | MovieLife</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        :root {
            --black: #000000;
            --red: #D92234;
            --white: #ffffff;
            --gray-300: #cccccc;
            --gray-500: #777777;
            --gray-700: #333333;
        }


        html {
            height: 100%;
        }


        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% 20%,
                    rgba(217, 34, 52, 0.12),
                    transparent 35%
                ),
                #000000;

            color: white;

            font-family:
                "Pretendard",
                "Noto Sans KR",
                Arial,
                sans-serif;
        }


        a {
            color: inherit;
            text-decoration: none;
        }


        button,
        input {
            font-family: inherit;
        }


        button {
            cursor: pointer;
        }



        /* =========================================
           HEADER
        ========================================= */

        .header {
            width: 100%;
            height: 76px;

            display: flex;
            align-items: center;

            padding: 0 6%;

            border-bottom:
                1px solid rgba(255,255,255,0.07);

            background:
                rgba(0,0,0,0.92);
        }


        .logo {
            display: flex;
            align-items: center;
            width: 145px;
        }


        .logo img {
            display: block;
            width: 145px;
            height: auto;
        }


        .header-right {
            margin-left: auto;
        }


        .back-home {
            color: #888;
            font-size: 13px;
            transition: 0.2s;
        }


        .back-home:hover {
            color: white;
        }



        /* =========================================
           LOGIN
        ========================================= */

        .login-container {
            min-height:
                calc(100vh - 76px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 70px 20px;
        }


        .login-wrapper {
            width: 100%;
            max-width: 470px;
        }


        .login-title {
            text-align: center;
            margin-bottom: 35px;
        }


        .login-title .small-title {
            color: var(--red);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }


        .login-title h1 {
            font-size: 32px;
            letter-spacing: -2px;
            margin-bottom: 9px;
        }


        .login-title p {
            color: #777;
            font-size: 13px;
        }



        /* =========================================
           CARD
        ========================================= */

        .login-card {
            padding: 38px;

            border:
                1px solid #252525;

            border-radius: 8px;

            background:
                rgba(16,16,16,0.95);

            box-shadow:
                0 30px 80px
                rgba(0,0,0,0.5);
        }



        /* =========================================
           INPUT
        ========================================= */

        .input-group {
            margin-bottom: 20px;
        }


        .input-group label {
            display: block;

            margin-bottom: 8px;

            color: #d0d0d0;

            font-size: 12px;
            font-weight: 600;
        }


        input {
            width: 100%;
            height: 48px;

            padding: 0 14px;

            outline: none;

            border:
                1px solid #333;

            border-radius: 5px;

            background: #080808;

            color: white;

            font-size: 13px;

            transition: 0.2s;
        }


        input::placeholder {
            color: #555;
        }


        input:focus {
            border-color:
                var(--red);

            background: #0c0c0c;

            box-shadow:
                0 0 0 2px
                rgba(217,34,52,0.08);
        }



        /* 로그인 오류 */

        .login-error {
            display: none;

            margin-top: 8px;

            color: #ff4d5a;

            font-size: 11px;

            line-height: 1.5;
        }


        .input-error {
            border-color:
                #ff4d5a !important;
        }



        /* =========================================
           OPTIONS
        ========================================= */

        .login-options {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-top: 5px;
            margin-bottom: 25px;
        }


        .remember-id {
            display: flex;
            align-items: center;

            gap: 7px;

            color: #777;

            font-size: 11px;

            cursor: pointer;
        }


        .remember-id input {
            width: 15px;
            height: 15px;

            accent-color:
                var(--red);
        }


        .find-account {
            display: flex;

            gap: 8px;

            color: #666;

            font-size: 11px;
        }


        .find-account a:hover {
            color: white;
        }


        .find-account .divider {
            color: #333;
        }



        /* =========================================
           BUTTON
        ========================================= */

        .login-button {
            width: 100%;
            height: 52px;

            border: none;
            border-radius: 5px;

            background:
                var(--red);

            color: white;

            font-size: 14px;
            font-weight: 700;

            transition: 0.25s;
        }


        .login-button:hover {
            background: #ed3043;

            transform:
                translateY(-2px);

            box-shadow:
                0 10px 30px
                rgba(217,34,52,0.25);
        }



        /* =========================================
           SIGNUP
        ========================================= */

        .signup-link {
            text-align: center;

            margin-top: 23px;
            padding-top: 23px;

            border-top:
                1px solid #222;

            color: #666;

            font-size: 12px;
        }


        .signup-link a {
            margin-left: 5px;

            color: white;

            font-weight: 600;
        }


        .signup-link a:hover {
            color: var(--red);
        }



        /* =========================================
           FOOTER
        ========================================= */

        .footer {
            padding: 25px 6%;

            border-top:
                1px solid #181818;

            text-align: center;

            color: #444;

            font-size: 10px;
        }



        @media (max-width: 600px) {

            .header {
                height: 68px;
                padding: 0 20px;
            }


            .logo {
                width: 125px;
            }


            .logo img {
                width: 125px;
            }


            .login-container {
                padding: 50px 15px;
            }


            .login-card {
                padding: 28px 20px;
            }


            .login-title h1 {
                font-size: 28px;
            }


            .login-options {
                align-items: flex-start;

                flex-direction: column;

                gap: 12px;
            }

        }

    </style>

</head>



<body>


<header class="header">

    <a
        href="/"
        class="logo"
    >

        <img
            src="/images/logo.png"
            alt="movieLife"
        >

    </a>


    <div class="header-right">

        <a
            href="/"
            class="back-home"
        >
            ← 메인으로
        </a>

    </div>

</header>



<main class="login-container">


    <div class="login-wrapper">


        <div class="login-title">

            <div class="small-title">
                MY MOVIE, MY LIFE
            </div>


            <h1>
                로그인
            </h1>


            <p>
                MovieLife에서
                나만의 영화 이야기를 만나보세요.
            </p>

        </div>



        <div class="login-card">


            <!-- 아이디 -->

            <div class="input-group">

                <label for="userId">
                    아이디
                </label>


                <input
                    type="text"
                    id="userId"
                    name="userId"
                    placeholder="아이디를 입력해주세요."
                >

            </div>



            <!-- 비밀번호 -->

            <div class="input-group">

                <label for="password">
                    비밀번호
                </label>


                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="비밀번호를 입력해주세요."
                >


                <div
                    id="loginError"
                    class="login-error"
                >
                    아이디 또는 비밀번호가 올바르지 않습니다.
                    입력한 정보를 다시 확인해 주세요.
                </div>

            </div>



            <div class="login-options">


                <label class="remember-id">

                    <input
                        type="checkbox"
                        id="rememberId"
                    >

                    아이디 저장

                </label>



                <div class="find-account">

                    <a href="#">
                        아이디 찾기
                    </a>

                    <span class="divider">
                        |
                    </span>

                    <a href="#">
                        비밀번호 찾기
                    </a>

                </div>


            </div>



            <button
                type="button"
                class="login-button"
                onclick="login()"
            >
                로그인
            </button>



            <div class="signup-link">

                아직 회원이 아니신가요?

                <a href="/signup">
                    회원가입
                </a>

            </div>


        </div>


    </div>


</main>



<footer class="footer">

    © 2026 movieLife. All Rights Reserved.

</footer>



<script>


    /* =========================================
       저장된 아이디 불러오기
    ========================================= */

    window.addEventListener(
        "load",
        function () {

            const savedUserId =
                localStorage.getItem(
                    "savedUserId"
                );


            if (savedUserId) {

                document
                    .getElementById("userId")
                    .value =
                    savedUserId;


                document
                    .getElementById("rememberId")
                    .checked =
                    true;

            }

        }
    );



    /* =========================================
       오류 숨기기
    ========================================= */

    function hideLoginError() {


        const loginError =
            document.getElementById(
                "loginError"
            );


        const userIdInput =
            document.getElementById(
                "userId"
            );


        const passwordInput =
            document.getElementById(
                "password"
            );


        loginError.style.display =
            "none";


        userIdInput.classList.remove(
            "input-error"
        );


        passwordInput.classList.remove(
            "input-error"
        );

    }



    /* =========================================
       오류 표시
    ========================================= */

    function showLoginError(message) {


        const loginError =
            document.getElementById(
                "loginError"
            );


        const userIdInput =
            document.getElementById(
                "userId"
            );


        const passwordInput =
            document.getElementById(
                "password"
            );


        loginError.textContent =
            message;


        loginError.style.display =
            "block";


        userIdInput.classList.add(
            "input-error"
        );


        passwordInput.classList.add(
            "input-error"
        );

    }



    /* =========================================
       로그인
    ========================================= */

    function login() {


        const userId =
            document
                .getElementById("userId")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const rememberId =
            document
                .getElementById("rememberId")
                .checked;


        hideLoginError();



        if (
            userId === "" ||
            password === ""
        ) {

            showLoginError(
                "아이디와 비밀번호를 입력해 주세요."
            );

            return;

        }



        fetch(
            "/api/members/login",
            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    userId: userId,

                    password: password

                })

            }
        )


        .then(async response => {


            const message =
                await response.text();


            if (!response.ok) {

                throw new Error(
                    message
                );

            }


            return message;

        })


        .then(() => {


            /*
             * 아이디 저장
             */

            if (rememberId) {

                localStorage.setItem(
                    "savedUserId",
                    userId
                );

            } else {

                localStorage.removeItem(
                    "savedUserId"
                );

            }



            /*
             * 로그인 전 페이지 주소 확인
             */

            const params =
                new URLSearchParams(
                    window.location.search
                );


            let returnUrl =
                params.get(
                    "returnUrl"
                );


            /*
             * returnUrl이 없거나
             * 잘못된 주소라면 홈으로
             */

            if (
                !returnUrl
                || !returnUrl.startsWith("/")
                || returnUrl.startsWith("//")
                || returnUrl.startsWith("/login")
            ) {

                returnUrl =
                    "/";

            }


            /*
             * 로그인 성공 팝업 없이
             * 이전 화면으로 이동
             */

            window.location.href =
                returnUrl;

        })


        .catch(error => {


            console.error(
                "로그인 실패:",
                error
            );


            showLoginError(
                "아이디 또는 비밀번호가 올바르지 않습니다. 입력한 정보를 다시 확인해 주세요."
            );

        });

    }



    /* =========================================
       입력하면 오류 없애기
    ========================================= */

    document
        .getElementById("userId")
        .addEventListener(
            "input",
            hideLoginError
        );


    document
        .getElementById("password")
        .addEventListener(
            "input",
            hideLoginError
        );



    /* =========================================
       Enter 로그인
    ========================================= */

    document
        .getElementById("userId")
        .addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter"
                ) {

                    login();

                }

            }
        );


    document
        .getElementById("password")
        .addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter"
                ) {

                    login();

                }

            }
        );


</script>


<script
    src="/js/auth-header.js"
    defer
></script>


</body>

</html>
