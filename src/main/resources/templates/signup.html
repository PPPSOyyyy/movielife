<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/layout :: head('회원가입')}">
    </head>
    <body class="ml-app">
        <th:block th:replace="~{fragments/layout :: header}">
        </th:block>
        <main id="main" class="shell auth-page">
            <section class="auth-intro">
                <p class="eyebrow">
                    START YOUR MOVIELIFE
                </p>
                <h1>
                    취향을 발견하는
                    <br>
                    <span>
                        첫 번째 장면.
                    </span>
                </h1>
                <p>
                    마음에 드는 영화를 모으고,
                    <br>
                    나만의 별점과 리뷰를 남겨 보세요.
                </p>
                <div class="auth-note">
                    좋은 영화가 남기는 여운, movieLife와 함께.
                </div>
            </section>
            <section class="auth-card">
                <h2>
                    회원가입
                </h2>
                <p>
                    나만의 영화 기록을 시작해 보세요.
                </p>
                <form id="signupForm" class="form-stack">
                    <label class="field">
                        <span>
                            아이디
                        </span>
                        <div class="field-row">
                            <input
                                id="signupUserId"
                                name="userId"
                                autocomplete="username"
                                placeholder="영문, 숫자, 밑줄 4~20자"
                                minlength="4"
                                maxlength="20"
                                pattern="[A-Za-z0-9_]{4,20}"
                                required
                            >
                            <button
                                class="btn"
                                type="button"
                                data-check="userId"
                            >
                                중복확인
                            </button>
                        </div>
                        <small id="userIdCheck" aria-live="polite">
                        </small>
                    </label>
                    <label class="field">
                        <span>
                            닉네임
                        </span>
                        <div class="field-row">
                            <input
                                id="signupNickname"
                                name="nickname"
                                placeholder="한글, 영문, 숫자, 밑줄 2~20자"
                                minlength="2"
                                maxlength="20"
                                pattern="[가-힣A-Za-z0-9_]{2,20}"
                                required
                            >
                            <button
                                class="btn"
                                type="button"
                                data-check="nickname"
                            >
                                중복확인
                            </button>
                        </div>
                        <small id="nicknameCheck" aria-live="polite">
                        </small>
                    </label>
                    <label class="field">
                        <span>
                            비밀번호
                        </span>
                        <div class="password-field">
                            <input
                                id="signupPassword"
                                name="password"
                                type="password"
                                autocomplete="new-password"
                                placeholder="영문, 숫자, 특수문자 포함 8자 이상"
                                minlength="8"
                                maxlength="50"
                                required
                            >
                            <button
                                type="button"
                                data-password-toggle="signupPassword"
                                aria-label="비밀번호 표시"
                            >
                                보기
                            </button>
                        </div>
                        <small>
                            8~50자 · 공백 제외 · 최대 72바이트
                        </small>
                    </label>
                    <label class="field">
                        <span>
                            비밀번호 확인
                        </span>
                        <input
                            id="signupPasswordConfirm"
                            type="password"
                            autocomplete="new-password"
                            placeholder="비밀번호를 한 번 더 입력해 주세요"
                            minlength="8"
                            maxlength="50"
                            required
                        >
                    </label>
                    <p
                        class="error-text"
                        id="signupError"
                        role="alert"
                    >
                    </p>
                    <button class="btn btn-primary btn-wide" type="submit">
                        회원가입
                    </button>
                </form>
                <p class="auth-bottom">
                    이미 회원이신가요?
                    <a href="/login" id="loginReturnLink">
                        로그인
                    </a>
                </p>
            </section>
        </main>
        <footer th:replace="~{fragments/layout :: footer}">
        </footer>
        <script src="/js/auth-header.js?v=20260915-3">
        </script>
        <script src="/js/account.js?v=20260915-3">
        </script>
    </body>
</html>
