<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/layout :: head('내가 작성한 리뷰')}">
    </head>
    <body class="ml-app">
        <th:block th:replace="~{fragments/layout :: header}">
        </th:block>
        <main
            id="main"
            class="shell page narrow"
            data-my-reviews
        >
            <div class="page-heading">
                <p class="eyebrow">
                    MY MOVIE JOURNAL
                </p>
                <h1>
                    내가 작성한 리뷰
                </h1>
                <p class="muted">
                    한 편의 영화, 나만의 감상을 기록하세요.
                </p>
            </div>
            <div class="section-head">
                <a href="/mypage" class="text-link">
                    ← 마이페이지
                </a>
                <a href="/review" class="btn btn-primary btn-sm">
                    새 리뷰 작성
                </a>
            </div>
            <div
                id="myReviews"
                class="review-list"
                aria-live="polite"
            >
                <p class="loading">
                    리뷰를 불러오는 중입니다.
                </p>
            </div>
        </main>
        <footer th:replace="~{fragments/layout :: footer}">
        </footer>
        <script src="/js/auth-header.js?v=upgrade20">
        </script>
        <script src="/js/reviews.js?v=upgrade20">
        </script>
    </body>
</html>
