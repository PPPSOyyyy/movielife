<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>영화 | movieLife</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        :root {
            --red: #D92234;
            --white: #ffffff;
            --black: #000000;
        }


        body {
            min-height: 100vh;
            background: #000;
            color: #fff;

            font-family:
                "Pretendard",
                "Noto Sans KR",
                Arial,
                sans-serif;
        }


        a {
            color: inherit;
            text-decoration: none;
        }


        button,
        input,
        select {
            font-family: inherit;
        }



        /* =========================
           HEADER
        ========================= */

        .header {
            width: 100%;
            height: 76px;

            display: flex;
            align-items: center;

            padding: 0 6%;

            border-bottom:
                1px solid #191919;

            background: #000;

            white-space: nowrap;
        }


        .logo {
            width: 145px;
            flex-shrink: 0;
        }


        .logo img {
            display: block;
            width: 145px;
        }


        .nav {
            display: flex;
            align-items: center;

            gap: 30px;

            margin-left: 45px;

            flex-wrap: nowrap;

            white-space: nowrap;
        }


        .nav a {
            position: relative;

            color: #bbb;

            font-size: 13px;

            white-space: nowrap;

            flex-shrink: 0;
        }


        .nav a:hover {
            color: white;
        }


        .nav a.active {
            color: white;
            font-weight: 700;
        }


        .nav a.active::after {
            content: "";

            position: absolute;

            left: 0;
            right: 0;
            bottom: -27px;

            height: 2px;

            background:
                var(--red);
        }


        .header-right {
            display: flex;
            align-items: center;

            gap: 10px;

            margin-left: auto;

            flex-shrink: 0;
        }


        .login-button,
        .signup-button {
            padding:
                9px 18px;

            border-radius:
                5px;

            font-size:
                11px;

            white-space:
                nowrap;
        }


        .login-button {
            border:
                1px solid #444;

            color:
                #fff;
        }


        .signup-button {
            background:
                var(--red);

            color:
                white;
        }



        /* =========================
           MAIN
        ========================= */

        .main {
            min-height:
                calc(100vh - 76px);

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(217,34,52,0.10),
                    transparent 32%
                ),
                #000;
        }


        .container {
            width: 100%;

            max-width:
                1120px;

            margin:
                0 auto;

            padding:
                65px 30px 100px;
        }


        .section-label {
            margin-bottom:
                10px;

            color:
                var(--red);

            font-size:
                11px;

            font-weight:
                800;

            letter-spacing:
                2px;
        }


        .page-title {
            margin-bottom:
                7px;

            font-size:
                34px;

            letter-spacing:
                -2px;
        }


        .page-description {
            color:
                #666;

            font-size:
                12px;
        }



        /* =========================
           영화 페이지 안쪽 메뉴
        ========================= */

        .movie-category-menu {
            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-top:
                25px;
        }


        .movie-category-button {
            padding:
                10px 15px;

            border:
                1px solid #333;

            border-radius:
                5px;

            background:
                #0d0d0d;

            color:
                #888;

            font-size:
                11px;

            transition:
                0.2s;
        }


        .movie-category-button:hover {
            color:
                white;

            border-color:
                #555;
        }


        .movie-category-button.active {
            border-color:
                var(--red);

            background:
                var(--red);

            color:
                white;

            font-weight:
                700;
        }



        /* =========================
           SEARCH
        ========================= */

        .search-area {
            margin-top:
                30px;
        }


        .search-form {
            display:
                grid;

            grid-template-columns:
                minmax(0, 1fr)
                105px;

            grid-template-rows:
                44px auto;

            column-gap:
                10px;

            width:
                100%;
        }


        .search-input {
            grid-column:
                1;

            grid-row:
                1;

            width:
                100%;

            height:
                44px;

            padding:
                0 15px;

            border:
                1px solid #333;

            border-radius:
                5px;

            outline:
                none;

            background:
                #111;

            color:
                #fff;

            font-size:
                13px;
        }


        .search-input:focus {
            border-color:
                var(--red);
        }


        .search-input.error {
            border-color:
                var(--red);
        }


        .search-button {
            grid-column:
                2;

            grid-row:
                1;

            height:
                44px;

            border:
                none;

            border-radius:
                5px;

            background:
                var(--red);

            color:
                white;

            font-size:
                12px;

            font-weight:
                700;

            cursor:
                pointer;
        }


        .search-error-message {
            grid-column:
                1;

            grid-row:
                2;

            min-height:
                19px;

            padding-top:
                6px;

            color:
                var(--red);

            font-size:
                11px;
        }



        /* =========================
           FILTER
        ========================= */

        .filter-box {
            margin-top:
                18px;

            padding:
                18px;

            border:
                1px solid #242424;

            border-radius:
                7px;

            background:
                #0d0d0d;
        }


        .filter-header {
            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            margin-bottom:
                14px;
        }


        .filter-title {
            color:
                #ddd;

            font-size:
                12px;

            font-weight:
                700;
        }


        .filter-description {
            color:
                #555;

            font-size:
                10px;
        }


        .filter-form {
            display:
                grid;

            grid-template-columns:
                repeat(4, 1fr)
                90px
                70px;

            gap:
                8px;
        }


        .filter-select {
            width:
                100%;

            height:
                40px;

            padding:
                0 10px;

            border:
                1px solid #333;

            border-radius:
                5px;

            outline:
                none;

            background:
                #111;

            color:
                #ccc;

            font-size:
                11px;
        }


        .filter-select:focus {
            border-color:
                var(--red);
        }


        .filter-button {
            height:
                40px;

            border:
                1px solid var(--red);

            border-radius:
                5px;

            background:
                var(--red);

            color:
                white;

            font-size:
                11px;

            font-weight:
                700;

            cursor:
                pointer;
        }


        .filter-reset {
            height:
                40px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border:
                1px solid #333;

            border-radius:
                5px;

            background:
                transparent;

            color:
                #777;

            font-size:
                11px;
        }


        .filter-reset:hover {
            color:
                white;

            border-color:
                #555;
        }



        /* =========================
           MOVIE GRID
        ========================= */

        .movie-grid {
            display:
                grid;

            grid-template-columns:
                repeat(
                    5,
                    minmax(0, 1fr)
                );

            gap:
                26px 16px;

            margin-top:
                30px;
        }


        .movie-card {
            min-width:
                0;
        }


        .poster-link {
            position:
                relative;

            display:
                block;

            width:
                100%;

            aspect-ratio:
                2 / 3;

            overflow:
                hidden;

            border-radius:
                7px;

            background:
                #111;

            transition:
                0.2s;
        }


        .poster-link:hover {
            transform:
                translateY(-3px);
        }


        .movie-poster {
            width:
                100%;

            height:
                100%;

            object-fit:
                cover;
        }


        .movie-rating {
            position:
                absolute;

            top:
                9px;

            right:
                9px;

            padding:
                5px 7px;

            border-radius:
                4px;

            background:
                rgba(0,0,0,0.82);

            color:
                #ffd54a;

            font-size:
                10px;
        }


        .movie-info {
            padding-top:
                10px;
        }


        .movie-title {
            display:
                block;

            overflow:
                hidden;

            color:
                white;

            font-size:
                13px;

            font-weight:
                700;

            white-space:
                nowrap;

            text-overflow:
                ellipsis;
        }


        .movie-date {
            margin-top:
                4px;

            color:
                #555;

            font-size:
                10px;
        }


        .movie-genres {
            display:
                flex;

            flex-wrap:
                wrap;

            gap:
                5px;

            margin-top:
                8px;
        }


        .movie-genre {
            padding:
                4px 6px;

            border:
                1px solid
                rgba(217,34,52,0.30);

            border-radius:
                3px;

            color:
                #c5c5c5;

            font-size:
                9px;
        }


        .movie-overview {
            display:
                -webkit-box;

            overflow:
                hidden;

            margin-top:
                8px;

            color:
                #6c6c6c;

            font-size:
                10px;

            line-height:
                1.6;

            -webkit-line-clamp:
                2;

            -webkit-box-orient:
                vertical;
        }



        /* =========================
           EMPTY
        ========================= */

        .empty-result {
            grid-column:
                1 / -1;

            padding:
                70px 20px;

            border:
                1px solid #222;

            border-radius:
                7px;

            text-align:
                center;

            color:
                #666;
        }



        /* =========================
           PAGINATION
        ========================= */

        .pagination {
            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                6px;

            margin-top:
                55px;
        }


        .page-button {
            min-width:
                34px;

            height:
                34px;

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                0 10px;

            border:
                1px solid #292929;

            border-radius:
                4px;

            background:
                #101010;

            color:
                #777;

            font-size:
                10px;
        }


        .page-button.active {
            border-color:
                var(--red);

            background:
                var(--red);

            color:
                white;
        }


        .page-button.disabled {
            pointer-events:
                none;

            opacity:
                0.35;
        }



        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1100px) {

            .header {
                padding:
                    0 20px;

                overflow-x:
                    auto;

                overflow-y:
                    hidden;
            }


            .nav {
                gap:
                    22px;

                margin-left:
                    30px;

                flex-wrap:
                    nowrap;

                white-space:
                    nowrap;
            }


            .nav a {
                white-space:
                    nowrap;

                flex-shrink:
                    0;
            }


            .logo {
                width:
                    125px;
            }


            .logo img {
                width:
                    125px;
            }

        }


        @media (max-width: 900px) {

            .filter-form {
                grid-template-columns:
                    repeat(2, 1fr);
            }


            .movie-grid {
                grid-template-columns:
                    repeat(3, 1fr);
            }

        }


        @media (max-width: 600px) {

            .header {
                overflow-x:
                    auto;

                overflow-y:
                    hidden;
            }


            .nav {
                display:
                    flex;

                flex-wrap:
                    nowrap;

                white-space:
                    nowrap;
            }


            .nav a {
                white-space:
                    nowrap;

                flex-shrink:
                    0;
            }


            .filter-form {
                grid-template-columns:
                    1fr;
            }


            .movie-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

    </style>

</head>


<body>


<header class="header">


    <a
        href="/"
        class="logo"
    >

        <img
            src="/images/logo.png"
            alt="movieLife"
        >

    </a>



    <!-- =========================
         상단 메뉴
    ========================= -->

    <nav class="nav">


        <a href="/">
            홈
        </a>


        <!--
            인기영화 화면이 아닐 때
            영화 메뉴 활성화
        -->

        <a
            href="/movies"
            th:classappend="${listType != 'popular'} ? 'active' : ''"
        >
            영화
        </a>


        <!--
            인기영화 화면일 때
            인기영화 메뉴 활성화
        -->

        <a
            href="/movies/popular"
            th:classappend="${listType == 'popular'} ? 'active' : ''"
        >
            인기영화
        </a>


        <a href="/movie-recommend">
            영화추천
        </a>


        <a href="/ott">
            OTT
        </a>


        <a href="/mypage">
            마이페이지
        </a>


    </nav>



    <div class="header-right">


        <a
            href="/login"
            class="login-button"
        >
            로그인
        </a>


        <a
            href="/signup"
            class="signup-button"
        >
            회원가입
        </a>


    </div>


</header>



<main class="main">


    <div class="container">


        <div class="section-label">
            FIND YOUR MOVIE
        </div>


        <h1
            class="page-title"
            th:text="${pageTitle}"
        >
            전체 영화
        </h1>


        <p class="page-description">
            영화 제목을 검색하거나 여러 조건을 조합해 원하는 영화를 찾아보세요.
        </p>



        <!-- ==========================================
             영화 페이지 안쪽 메뉴

             인기영화에서는 아예 표시하지 않음
        ========================================== -->

        <div
            class="movie-category-menu"
            th:if="${listType != 'popular'}"
        >


            <a
                href="/movies"
                class="movie-category-button"
                th:classappend="${listType == 'all'} ? ' active' : ''"
            >
                전체 영화
            </a>


            <a
                href="/movies/top-rated"
                class="movie-category-button"
                th:classappend="${listType == 'topRated'} ? ' active' : ''"
            >
                평점 높은 영화
            </a>


            <a
                href="/movies/upcoming"
                class="movie-category-button"
                th:classappend="${listType == 'upcoming'} ? ' active' : ''"
            >
                개봉 예정 영화
            </a>


        </div>



        <!-- =========================
             검색
        ========================= -->

        <div class="search-area">


            <form
                id="movieSearchForm"
                class="search-form"
                action="/movies"
                method="get"
            >


                <input
                    type="text"

                    id="movieSearchInput"

                    class="search-input"

                    name="query"

                    th:value="${query}"

                    placeholder="영화 제목을 입력하세요"

                    autocomplete="off"
                >


                <button
                    type="submit"
                    class="search-button"
                >
                    검색
                </button>


                <p
                    id="searchErrorMessage"
                    class="search-error-message"
                ></p>


            </form>


        </div>



        <!-- =========================
             필터
        ========================= -->

        <section class="filter-box">


            <div class="filter-header">


                <div class="filter-title">
                    영화 상세 필터
                </div>


                <div class="filter-description">
                    여러 조건을 동시에 선택할 수 있습니다.
                </div>


            </div>



            <form
                class="filter-form"
                action="/movies"
                method="get"
            >


                <!-- 장르 -->

                <select
                    class="filter-select"
                    name="genre"
                >


                    <option value="">
                        장르 전체
                    </option>


                    <option
                        value="28"
                        th:selected="${selectedGenre == 28}"
                    >
                        액션
                    </option>


                    <option
                        value="12"
                        th:selected="${selectedGenre == 12}"
                    >
                        모험
                    </option>


                    <option
                        value="16"
                        th:selected="${selectedGenre == 16}"
                    >
                        애니메이션
                    </option>


                    <option
                        value="35"
                        th:selected="${selectedGenre == 35}"
                    >
                        코미디
                    </option>


                    <option
                        value="80"
                        th:selected="${selectedGenre == 80}"
                    >
                        범죄
                    </option>


                    <option
                        value="18"
                        th:selected="${selectedGenre == 18}"
                    >
                        드라마
                    </option>


                    <option
                        value="14"
                        th:selected="${selectedGenre == 14}"
                    >
                        판타지
                    </option>


                    <option
                        value="27"
                        th:selected="${selectedGenre == 27}"
                    >
                        공포
                    </option>


                    <option
                        value="10749"
                        th:selected="${selectedGenre == 10749}"
                    >
                        로맨스
                    </option>


                    <option
                        value="878"
                        th:selected="${selectedGenre == 878}"
                    >
                        SF
                    </option>


                    <option
                        value="53"
                        th:selected="${selectedGenre == 53}"
                    >
                        스릴러
                    </option>


                </select>



                <!-- 최소 평점 -->

                <select
                    class="filter-select"
                    name="minRating"
                >


                    <option value="">
                        최소 평점 전체
                    </option>


                    <option
                        value="5"
                        th:selected="${selectedMinRating == 5.0}"
                    >
                        5점 이상
                    </option>


                    <option
                        value="6"
                        th:selected="${selectedMinRating == 6.0}"
                    >
                        6점 이상
                    </option>


                    <option
                        value="7"
                        th:selected="${selectedMinRating == 7.0}"
                    >
                        7점 이상
                    </option>


                    <option
                        value="8"
                        th:selected="${selectedMinRating == 8.0}"
                    >
                        8점 이상
                    </option>


                    <option
                        value="9"
                        th:selected="${selectedMinRating == 9.0}"
                    >
                        9점 이상
                    </option>


                </select>



                <!-- 개봉연도 -->

                <select
                    class="filter-select"
                    name="year"
                >


                    <option value="">
                        개봉연도 전체
                    </option>


                    <option
                        value="2026"
                        th:selected="${selectedYear == 2026}"
                    >
                        2026년
                    </option>


                    <option
                        value="2025"
                        th:selected="${selectedYear == 2025}"
                    >
                        2025년
                    </option>


                    <option
                        value="2024"
                        th:selected="${selectedYear == 2024}"
                    >
                        2024년
                    </option>


                    <option
                        value="2023"
                        th:selected="${selectedYear == 2023}"
                    >
                        2023년
                    </option>


                    <option
                        value="2022"
                        th:selected="${selectedYear == 2022}"
                    >
                        2022년
                    </option>


                    <option
                        value="2021"
                        th:selected="${selectedYear == 2021}"
                    >
                        2021년
                    </option>


                    <option
                        value="2020"
                        th:selected="${selectedYear == 2020}"
                    >
                        2020년
                    </option>


                    <option
                        value="2019"
                        th:selected="${selectedYear == 2019}"
                    >
                        2019년
                    </option>


                    <option
                        value="2018"
                        th:selected="${selectedYear == 2018}"
                    >
                        2018년
                    </option>


                    <option
                        value="2017"
                        th:selected="${selectedYear == 2017}"
                    >
                        2017년
                    </option>


                    <option
                        value="2016"
                        th:selected="${selectedYear == 2016}"
                    >
                        2016년
                    </option>


                    <option
                        value="2015"
                        th:selected="${selectedYear == 2015}"
                    >
                        2015년
                    </option>


                </select>



                <!-- OTT -->

                <select
                    class="filter-select"
                    name="provider"
                >


                    <option value="">
                        OTT 전체
                    </option>


                    <option
                        value="8"
                        th:selected="${selectedProvider == 8}"
                    >
                        Netflix
                    </option>


                    <option
                        value="337"
                        th:selected="${selectedProvider == 337}"
                    >
                        Disney+
                    </option>


                    <option
                        value="97"
                        th:selected="${selectedProvider == 97}"
                    >
                        Watcha
                    </option>


                    <option
                        value="356"
                        th:selected="${selectedProvider == 356}"
                    >
                        Wavve
                    </option>


                </select>



                <button
                    type="submit"
                    class="filter-button"
                >
                    적용
                </button>


                <a
                    href="/movies"
                    class="filter-reset"
                >
                    초기화
                </a>


            </form>


        </section>



        <!-- =========================
             영화 목록
        ========================= -->

        <section class="movie-grid">


            <article
                class="movie-card"
                th:each="movie : ${movies}"
            >


                <a
                    class="poster-link"
                    th:href="@{/movies/{id}(id=${movie.id})}"
                >


                    <img
                        class="movie-poster"

                        th:src="${movie.posterUrl}"

                        th:alt="${movie.title}"

                        onerror="this.onerror=null; this.src='/poster/no-poster.png';"
                    >


                    <span
                        class="movie-rating"

                        th:if="${movie.voteAverage != null}"

                        th:text="'★ ' + ${#numbers.formatDecimal(movie.voteAverage, 1, 1)}"
                    >
                        ★ 0.0
                    </span>


                </a>



                <div class="movie-info">


                    <a
                        class="movie-title"

                        th:href="@{/movies/{id}(id=${movie.id})}"

                        th:text="${movie.title}"
                    >
                        영화 제목
                    </a>


                    <div
                        class="movie-date"

                        th:text="${movie.releaseDate != null && !movie.releaseDate.isEmpty()}
                            ? '개봉일 : ' + ${movie.releaseDate}
                            : '개봉일 정보 없음'"
                    >
                        개봉일
                    </div>



                    <div
                        class="movie-genres"

                        th:if="${movie.genreNames != null && !movie.genreNames.isEmpty()}"
                    >


                        <span
                            class="movie-genre"

                            th:each="genreName : ${movie.genreNames}"

                            th:text="${genreName}"
                        >
                            장르
                        </span>


                    </div>



                    <p
                        class="movie-overview"

                        th:text="${movie.overview != null && !movie.overview.isEmpty()}
                            ? ${movie.overview}
                            : '줄거리 정보가 없습니다.'"
                    >
                        줄거리
                    </p>


                </div>


            </article>



            <div
                class="empty-result"

                th:if="${movies == null || movies.isEmpty()}"
            >

                선택한 조건에 맞는 영화가 없습니다.

                <br><br>

                다른 조건으로 검색해보세요.

            </div>


        </section>



        <!-- =========================
             일반 영화 페이지
        ========================= -->

        <div
            class="pagination"

            th:if="${totalPages != null
                && totalPages > 1
                && listType == 'all'}"
        >


            <a
                class="page-button"

                th:classappend="${currentPage <= 1}
                    ? ' disabled'
                    : ''"

                th:href="@{/movies(
                    page=${currentPage - 1},
                    query=${query},
                    genre=${selectedGenre},
                    minRating=${selectedMinRating},
                    year=${selectedYear},
                    provider=${selectedProvider}
                )}"
            >
                이전
            </a>



            <a
                class="page-button"

                th:each="pageNumber :
                    ${#numbers.sequence(
                        startPage,
                        endPage
                    )}"

                th:text="${pageNumber}"

                th:classappend="${pageNumber == currentPage}
                    ? ' active'
                    : ''"

                th:href="@{/movies(
                    page=${pageNumber},
                    query=${query},
                    genre=${selectedGenre},
                    minRating=${selectedMinRating},
                    year=${selectedYear},
                    provider=${selectedProvider}
                )}"
            >
                1
            </a>



            <a
                class="page-button"

                th:classappend="${currentPage >= totalPages}
                    ? ' disabled'
                    : ''"

                th:href="@{/movies(
                    page=${currentPage + 1},
                    query=${query},
                    genre=${selectedGenre},
                    minRating=${selectedMinRating},
                    year=${selectedYear},
                    provider=${selectedProvider}
                )}"
            >
                다음
            </a>


        </div>



        <!-- =========================

        ========================= -->

        <div
            class="pagination"

            th:if="${totalPages != null
                && totalPages > 1
                && listType == 'popular'}"
        >


            <a
                class="page-button"

                th:classappend="${currentPage <= 1}
                    ? ' disabled'
                    : ''"

                th:href="@{/movies/popular(
                    page=${currentPage - 1}
                )}"
            >
                이전
            </a>



            <a
                class="page-button"

                th:each="pageNumber :
                    ${#numbers.sequence(
                        startPage,
                        endPage
                    )}"

                th:text="${pageNumber}"

                th:classappend="${pageNumber == currentPage}
                    ? ' active'
                    : ''"

                th:href="@{/movies/popular(
                    page=${pageNumber}
                )}"
            >
                1
            </a>



            <a
                class="page-button"

                th:classappend="${currentPage >= totalPages}
                    ? ' disabled'
                    : ''"

                th:href="@{/movies/popular(
                    page=${currentPage + 1}
                )}"
            >
                다음
            </a>


        </div>



        <!-- =========================
             평점 높은 영화
        ========================= -->

        <div
            class="pagination"

            th:if="${totalPages != null
                && totalPages > 1
                && listType == 'topRated'}"
        >


            <a
                class="page-button"

                th:classappend="${currentPage <= 1}
                    ? ' disabled'
                    : ''"

                th:href="@{/movies/top-rated(
                    page=${currentPage - 1}
                )}"
            >
                이전
            </a>



            <a
                class="page-button"

                th:each="pageNumber :
                    ${#numbers.sequence(
                        startPage,
                        endPage
                    )}"

                th:text="${pageNumber}"

                th:classappend="${pageNumber == currentPage}
                    ? ' active'
                    : ''"

                th:href="@{/movies/top-rated(
                    page=${pageNumber}
                )}"
            >
                1
            </a>



            <a
                class="page-button"

                th:classappend="${currentPage >= totalPages}
                    ? ' disabled'
                    : ''"

                th:href="@{/movies/top-rated(
                    page=${currentPage + 1}
                )}"
            >
                다음
            </a>


        </div>



        <!-- =========================
             개봉 예정 영화
        ========================= -->

        <div
            class="pagination"

            th:if="${totalPages != null
                && totalPages > 1
                && listType == 'upcoming'}"
        >


            <a
                class="page-button"

                th:classappend="${currentPage <= 1}
                    ? ' disabled'
                    : ''"

                th:href="@{/movies/upcoming(
                    page=${currentPage - 1}
                )}"
            >
                이전
            </a>



            <a
                class="page-button"

                th:each="pageNumber :
                    ${#numbers.sequence(
                        startPage,
                        endPage
                    )}"

                th:text="${pageNumber}"

                th:classappend="${pageNumber == currentPage}
                    ? ' active'
                    : ''"

                th:href="@{/movies/upcoming(
                    page=${pageNumber}
                )}"
            >
                1
            </a>



            <a
                class="page-button"

                th:classappend="${currentPage >= totalPages}
                    ? ' disabled'
                    : ''"

                th:href="@{/movies/upcoming(
                    page=${currentPage + 1}
                )}"
            >
                다음
            </a>


        </div>


    </div>


</main>



<script>

    document.addEventListener(

        "DOMContentLoaded",

        function () {


            const form =
                document.getElementById(
                    "movieSearchForm"
                );


            const input =
                document.getElementById(
                    "movieSearchInput"
                );


            const error =
                document.getElementById(
                    "searchErrorMessage"
                );


            if (
                !form ||
                !input ||
                !error
            ) {

                return;
            }


            form.addEventListener(

                "submit",

                function (event) {


                    const keyword =
                        input
                            .value
                            .trim();


                    if (keyword === "") {


                        event.preventDefault();


                        error.textContent =
                            "검색할 영화 제목을 입력해 주세요.";


                        input
                            .classList
                            .add(
                                "error"
                            );


                        input.focus();


                        return;
                    }


                    error.textContent =
                        "";


                    input
                        .classList
                        .remove(
                            "error"
                        );

                }

            );


            input.addEventListener(

                "input",

                function () {


                    if (
                        input
                            .value
                            .trim()
                            .length > 0
                    ) {


                        error.textContent =
                            "";


                        input
                            .classList
                            .remove(
                                "error"
                            );

                    }

                }

            );

        }

    );

</script>
