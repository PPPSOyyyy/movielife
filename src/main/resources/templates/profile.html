<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/layout :: head('프로필 수정')}">
    </head>
    <body class="ml-app">
        <th:block th:replace="~{fragments/layout :: header}">
        </th:block>
        <main
            id="main"
            class="shell page settings-page"
            data-profile-page
        >
            <div class="page-heading">
                <p class="eyebrow">
                    ACCOUNT SETTINGS
                </p>
                <h1>
                    프로필 수정
                </h1>
                <p class="muted">
                    나를 표현하는 이름과 계정 정보를 관리하세요.
                </p>
            </div>
            <form id="profileForm" class="panel profile-form">
                <fieldset>
                    <legend>
                        기본 정보
                    </legend>
                    <label class="field">
                        <span>
                            아이디
                        </span>
                        <input id="profileUserId" readonly>
                    </label>
                    <label class="field">
                        <span>
                            닉네임
                        </span>
                        <input
                            id="profileNickname"
                            name="nickname"
                            minlength="2"
                            maxlength="20"
                            pattern="[가-힣A-Za-z0-9_]{2,20}"
                            required
                        >
                        <small>
                            한글, 영문, 숫자, 밑줄로 2~20자
                        </small>
                    </label>
                </fieldset>
                <hr class="divider" style="margin:0">
                <fieldset>
                    <legend>
                        비밀번호 변경
                        <span class="small muted">
                            · 선택
                        </span>
                    </legend>
                    <p class="muted small">
                        비밀번호를 변경할 때만 아래 항목을 입력해 주세요.
                    </p>
                    <label class="field" style="margin-top:18px">
                        <span>
                            현재 비밀번호
                        </span>
                        <input
                            id="currentPassword"
                            type="password"
                            autocomplete="current-password"
                        >
                    </label>
                    <label class="field">
                        <span>
                            새 비밀번호
                        </span>
                        <input
                            id="newPassword"
                            type="password"
                            autocomplete="new-password"
                            minlength="8"
                            maxlength="50"
                        >
                        <small>
                            영문, 숫자, 특수문자 포함 8~50자 · 공백 제외
                        </small>
                    </label>
                    <label class="field">
                        <span>
                            새 비밀번호 확인
                        </span>
                        <input
                            id="newPasswordConfirm"
                            type="password"
                            autocomplete="new-password"
                            maxlength="50"
                        >
                    </label>
                </fieldset>
                <p
                    class="error-text"
                    id="profileError"
                    role="alert"
                >
                </p>
                <div class="actions" style="justify-content:end">
                    <a class="btn btn-ghost" href="/mypage">
                        취소
                    </a>
                    <button type="submit" class="btn btn-primary">
                        변경사항 저장
                    </button>
                </div>
            </form>
        </main>
        <footer th:replace="~{fragments/layout :: footer}">
        </footer>
        <script src="/js/auth-header.js?v=20260915-3">
        </script>
        <script src="/js/account.js?v=20260915-3">
        </script>
    </body>
</html>
