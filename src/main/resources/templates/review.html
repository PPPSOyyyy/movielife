<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>리뷰 등록 | movieLife</title>


    <style>

        /* ==================================================
           기본 설정
        ================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        :root {

            --black: #000000;

            --red: #D92234;

            --white: #FFFFFF;

            --gray: #777777;

            --dark-gray: #222222;

            --border: #2A2A2A;

            --card: #101010;

        }


        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(217, 34, 52, 0.10),
                    transparent 35%
                ),
                #000000;

            color: #FFFFFF;

            font-family:
                "Pretendard",
                "Noto Sans KR",
                Arial,
                sans-serif;

        }


        a {

            color: inherit;

            text-decoration: none;

        }


        button,
        input,
        textarea,
        select {

            font-family: inherit;

        }



        /* ==================================================
           HEADER
        ================================================== */

        .header {

            position: fixed;

            top: 0;
            left: 0;

            z-index: 1000;

            width: 100%;

            height: 76px;

            display: flex;

            align-items: center;

            padding: 0 6%;

            background:
                rgba(0, 0, 0, 0.95);

            border-bottom:
                1px solid rgba(255, 255, 255, 0.07);

            backdrop-filter: blur(10px);

        }


        /* ==================================================
           LOGO
        ================================================== */

        .logo {

            display: flex;

            align-items: center;

            width: 145px;

            flex-shrink: 0;

        }


        .logo img {

            display: block;

            width: 145px;

            height: auto;

        }



        /* ==================================================
           NAVIGATION
        ================================================== */

        .nav {

            display: flex;

            align-items: center;

            gap: 30px;

            margin-left: 45px;

        }


        .nav a {

            position: relative;

            color: #BDBDBD;

            font-size: 14px;

            font-weight: 500;

            transition: 0.25s;

        }


        .nav a:hover {

            color: #FFFFFF;

        }


        .nav a.active {

            color: #FFFFFF;

            font-weight: 700;

        }


        .nav a.active::after {

            content: "";

            position: absolute;

            left: 0;

            bottom: -9px;

            width: 100%;

            height: 2px;

            background: var(--red);

        }



        /* ==================================================
           HEADER RIGHT
        ================================================== */

        .header-right {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-left: auto;

        }


        .login-button {

            padding: 9px 18px;

            border:
                1px solid #444444;

            border-radius: 5px;

            background: transparent;

            color: #FFFFFF;

            font-size: 12px;

        }


        .signup-button,
        .logout-button {

            padding: 9px 18px;

            border:
                1px solid var(--red);

            border-radius: 5px;

            background: var(--red);

            color: #FFFFFF;

            font-size: 12px;

        }

        .logout-button {
            cursor: pointer;
        }

        .login-user {
            color: #FFFFFF;
            font-size: 13px;
        }



        /* ==================================================
           MAIN
        ================================================== */

        .main {

            max-width: 760px;

            margin: 0 auto;

            padding:
                135px 30px 100px;

        }



        /* ==================================================
           PAGE HEADER
        ================================================== */

        .page-header {

            margin-bottom: 35px;

        }


        .page-label {

            margin-bottom: 10px;

            color: var(--red);

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 2px;

        }


        .page-header h1 {

            margin-bottom: 10px;

            font-size: 40px;

            letter-spacing: -2px;

        }


        .page-header p {

            color: #666666;

            font-size: 13px;

            line-height: 1.7;

        }



        /* ==================================================
           REVIEW CARD
        ================================================== */

        .review-card {

            padding: 35px;

            border:
                1px solid var(--border);

            border-radius: 8px;

            background:
                linear-gradient(
                    145deg,
                    #111111,
                    #090909
                );

        }



        /* ==================================================
           FORM GROUP
        ================================================== */

        .form-group {

            margin-bottom: 27px;

        }


        .form-label {

            display: block;

            margin-bottom: 10px;

            color: #FFFFFF;

            font-size: 12px;

            font-weight: 700;

        }


        .required {

            margin-left: 3px;

            color: var(--red);

        }



        /* ==================================================
           MOVIE ID
        ================================================== */

        .movie-id-input {

            width: 100%;

            height: 45px;

            padding: 0 14px;

            border:
                1px solid #303030;

            border-radius: 5px;

            outline: none;

            background: #080808;

            color: #FFFFFF;

            font-size: 12px;

            transition: 0.2s;

        }


        .movie-id-input:focus {

            border-color: var(--red);

        }


        .form-help {

            margin-top: 7px;

            color: #555555;

            font-size: 9px;

        }



        /* ==================================================
           RATING
        ================================================== */

        .rating-select {

            width: 100%;

            height: 45px;

            padding: 0 14px;

            border:
                1px solid #303030;

            border-radius: 5px;

            outline: none;

            background: #080808;

            color: #FFFFFF;

            font-size: 12px;

            cursor: pointer;

        }


        .rating-select:focus {

            border-color: var(--red);

        }


        .rating-select option {

            background: #101010;

            color: #FFFFFF;

        }



        /* ==================================================
           REVIEW CONTENT
        ================================================== */

        .review-textarea {

            width: 100%;

            min-height: 180px;

            padding: 15px;

            border:
                1px solid #303030;

            border-radius: 5px;

            outline: none;

            resize: vertical;

            background: #080808;

            color: #FFFFFF;

            font-size: 12px;

            line-height: 1.7;

            transition: 0.2s;

        }


        .review-textarea::placeholder {

            color: #555555;

        }


        .review-textarea:focus {

            border-color: var(--red);

        }


        .review-guide {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 8px;
            font-size: 11px;
        }

        .review-error {
            min-height: 16px;
            color: #ff4d5a;
        }

        .review-count-text {
            margin-left: auto;
            color: #666;
            white-space: nowrap;
        }



        /* ==================================================
           DIVIDER
        ================================================== */

        .divider {

            margin:
                5px 0 28px;

            border-top:
                1px solid #222222;

        }



        /* ==================================================
           SUBMIT BUTTON
        ================================================== */

        .submit-button {

            width: 100%;

            height: 48px;

            border: none;

            border-radius: 5px;

            background: var(--red);

            color: #FFFFFF;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.25s;

        }


        .submit-button:hover {

            background: #B91D2E;

            transform:
                translateY(-2px);

        }


        .submit-button:active {

            transform:
                translateY(0);

        }



        /* ==================================================
           CANCEL BUTTON
        ================================================== */

        .cancel-button {

            display: flex;

            align-items: center;

            justify-content: center;

            width: 100%;

            height: 45px;

            margin-top: 9px;

            border:
                1px solid #333333;

            border-radius: 5px;

            background: transparent;

            color: #888888;

            font-size: 11px;

            transition: 0.2s;

        }


        .cancel-button:hover {

            border-color: #555555;

            color: #FFFFFF;

        }



        /* ==================================================
           FOOTER
        ================================================== */

        .footer {

            padding: 30px 6%;

            border-top:
                1px solid #181818;

            text-align: center;

            color: #444444;

            font-size: 10px;

        }



        /* ==================================================
           MOBILE
        ================================================== */

        @media (max-width: 700px) {


            .header {

                height: 68px;

                padding: 0 20px;

            }


            .logo,
            .logo img {

                width: 125px;

            }


            .nav {

                display: none;

            }


            .login-button,
            .signup-button,
            .logout-button,
            .login-user {

                display: none;

            }


            .main {

                padding:
                    105px 20px 70px;

            }


            .page-header h1 {

                font-size: 30px;

            }


            .review-card {

                padding: 23px;

            }

        }

    </style>

</head>



<body>


<!-- ==================================================
     HEADER
================================================== -->

<header class="header">


    <!-- 로고 -->

    <a
        href="/"
        class="logo"
    >

        <img
            src="/images/logo.png"
            alt="movieLife"
        >

    </a>



    <!-- 네비게이션 -->

    <nav class="nav">


        <a href="/">
            홈
        </a>


        <a
            href="/movies"
            class="active"
        >
            영화
        </a>


        <a href="/popular">
            인기영화
        </a>


        <a href="/movie-recommend">
            영화추천
        </a>


        <a href="/ott">
            OTT
        </a>


        <a href="/mypage">
            마이페이지
        </a>


    </nav>



    <!-- 로그인 / 회원가입 -->

    <div
        class="header-right"
        th:if="${session.loginUserId == null}"
    >


        <a
            href="/login"
            class="login-button"
        >
            로그인
        </a>


        <a
            href="/signup"
            class="signup-button"
        >
            회원가입
        </a>


    </div>

    <div
        class="header-right"
        th:if="${session.loginUserId != null}"
    >
        <span
            class="login-user"
            th:text="${session.loginUserId} + '님'"
        >사용자님</span>

        <button
            type="button"
            class="logout-button"
            onclick="logout()"
        >
            로그아웃
        </button>
    </div>


</header>



<!-- ==================================================
     MAIN
================================================== -->

<main class="main">


    <!-- 페이지 제목 -->

    <section class="page-header">


        <div class="page-label">
            MOVIE REVIEW
        </div>


        <h1
            th:text="${editMode ? '리뷰 수정' : '리뷰 등록'}"
        >
            리뷰 등록
        </h1>


        <p
            th:if="${!editMode}"
        >
            영화를 보고 느낀 점을 자유롭게 남겨보세요.<br>
            여러분의 리뷰가 다른 사람의 영화 선택에 도움이 됩니다.
        </p>

        <p
            th:if="${editMode}"
        >
            기존에 작성한 별점과 리뷰 내용을 수정할 수 있습니다.<br>
            수정한 내용은 저장 후 나의 리뷰에 바로 반영됩니다.
        </p>


    </section>



    <!-- ==================================================
         REVIEW FORM
    ================================================== -->

    <section class="review-card">


        <form
            action="/api/reviews"
            method="post"
        >


            <!-- ==================================================
                 영화 ID
            ================================================== -->

            <div class="form-group">


                <label
                    class="form-label"
                    for="movieTitle"
                >

                    영화

                    <span class="required">
                        *
                    </span>

                </label>


                <input
                    type="text"
                    id="movieTitle"
                    class="movie-id-input"
                    th:value="${movie.title}"
                    readonly
                >

                <input
                    type="hidden"
                    id="movieId"
                    name="movieId"
                    th:value="${movieId}"
                >

                <input
                    type="hidden"
                    id="reviewId"
                    th:value="${editMode ? review.id : ''}"
                >


                <p class="form-help">
                    선택한 영화가 자동으로 입력됩니다.
                </p>


            </div>



            <!-- ==================================================
                 별점
            ================================================== -->

            <div class="form-group">


                <label
                    class="form-label"
                    for="rating"
                >

                    별점

                    <span class="required">
                        *
                    </span>

                </label>


                <select
                    id="rating"
                    name="rating"
                    class="rating-select"
                    required
                >

                    <option
                        value="1"
                        th:selected="${editMode && review.rating == 1}"
                    >
                        ⭐ 1점
                    </option>

                    <option
                        value="2"
                        th:selected="${editMode && review.rating == 2}"
                    >
                        ⭐⭐ 2점
                    </option>

                    <option
                        value="3"
                        th:selected="${editMode && review.rating == 3}"
                    >
                        ⭐⭐⭐ 3점
                    </option>

                    <option
                        value="4"
                        th:selected="${editMode && review.rating == 4}"
                    >
                        ⭐⭐⭐⭐ 4점
                    </option>

                    <option
                        value="5"
                        th:selected="${!editMode || review.rating == 5}"
                    >
                        ⭐⭐⭐⭐⭐ 5점
                    </option>

                </select>


            </div>



            <!-- 구분선 -->

            <div class="divider"></div>



            <!-- ==================================================
                 리뷰 내용
            ================================================== -->

            <div class="form-group">


                <label
                    class="form-label"
                    for="content"
                >

                    리뷰

                    <span class="required">
                        *
                    </span>

                </label>


                <textarea
                    id="content"
                    name="content"
                    class="review-textarea"
                    rows="7"
                    maxlength="1000"
                    placeholder="영화를 보고 느낀 점을 자유롭게 작성해주세요."
                    required
                    th:text="${editMode ? review.content : ''}"
                ></textarea>

                <div class="review-guide">
                    <span id="reviewError" class="review-error"></span>
                    <span id="reviewCharCount" class="review-count-text">0 / 1000</span>
                </div>


            </div>



            <!-- ==================================================
                 버튼
            ================================================== -->

            <button
                type="submit"
                class="submit-button"
                th:text="${editMode ? '수정 완료' : '리뷰 등록'}"
            >
                리뷰 등록
            </button>


            <a
                th:href="${editMode ? '/my-reviews' : '/mypage'}"
                class="cancel-button"
            >
                취소
            </a>


        </form>


    </section>


</main>



<!-- ==================================================
     FOOTER
================================================== -->

<footer class="footer">

    © 2026 movieLife. All Rights Reserved.

</footer>

<script>

const reviewForm = document.querySelector("form");
const reviewContent = document.getElementById("content");
const reviewError = document.getElementById("reviewError");
const reviewCharCount = document.getElementById("reviewCharCount");
const ratingSelect = document.getElementById("rating");
const reviewIdInput = document.getElementById("reviewId");

const reviewId = reviewIdInput.value;
const editMode = reviewId !== "";


/* ==================================================
   글자 수 표시
================================================== */

function updateReviewCount() {

    const length =
        reviewContent.value.length;

    reviewCharCount.textContent =
        `${length} / 1000`;

    if (length > 1000) {

        reviewError.textContent =
            "리뷰는 1000자 이하로 작성해주세요.";

    } else {

        reviewError.textContent =
            "";
    }
}


reviewContent.addEventListener(
    "input",
    updateReviewCount
);


/* ==================================================
   리뷰 등록 / 수정
================================================== */

reviewForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const content =
            reviewContent.value;

        const rating =
            Number(ratingSelect.value);

        reviewError.textContent =
            "";


        if (
            !Number.isInteger(rating) ||
            rating < 1 ||
            rating > 5
        ) {

            reviewError.textContent =
                "별점은 1점부터 5점까지 선택해주세요.";

            return;
        }


        if (content.trim() === "") {

            reviewError.textContent =
                "리뷰 내용을 입력해주세요.";

            reviewContent.focus();

            return;
        }


        if (content.trim().length > 1000) {

            reviewError.textContent =
                "리뷰는 1000자 이하로 작성해주세요.";

            reviewContent.focus();

            return;
        }


        const formData =
            new FormData();

        formData.append(
            "rating",
            rating
        );

        formData.append(
            "content",
            content.trim()
        );


        if (!editMode) {

            formData.append(
                "movieId",
                document.getElementById("movieId").value
            );
        }


        try {

            const requestUrl =
                editMode
                    ? `/api/reviews/${reviewId}`
                    : "/api/reviews";

            const requestMethod =
                editMode
                    ? "PUT"
                    : "POST";


            const response =
                await fetch(
                    requestUrl,
                    {
                        method: requestMethod,
                        body: formData
                    }
                );


            if (response.status === 401) {

                const returnUrl =
                    window.location.pathname
                    + window.location.search;

                if (
                    typeof openLoginRequiredModal
                    === "function"
                ) {

                    openLoginRequiredModal(
                        returnUrl
                    );

                } else {

                    window.location.href =
                        "/login?returnUrl="
                        + encodeURIComponent(
                            returnUrl
                        );
                }

                return;
            }


            if (!response.ok) {

                const message =
                    await response.text();

                reviewError.textContent =
                    message;

                return;
            }


            if (editMode) {

                alert(
                    "리뷰가 수정되었습니다."
                );

            } else {

                alert(
                    "리뷰를 작성했습니다."
                );
            }


            window.location.href =
                "/my-reviews";


        } catch (error) {

            console.error(error);

            reviewError.textContent =
                editMode
                    ? "리뷰 수정 중 오류가 발생했습니다. 다시 시도해주세요."
                    : "리뷰 등록 중 오류가 발생했습니다. 다시 시도해주세요.";
        }
    }
);


/* ==================================================
   최초 글자 수 표시
================================================== */

updateReviewCount();

</script>

<script src="/js/auth-header.js" defer></script>
</body>

</html>
