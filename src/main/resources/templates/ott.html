<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/layout :: head('OTT')}">
    </head>
    <body class="ml-app">
        <th:block th:replace="~{fragments/layout :: header}">
        </th:block>
        <main
            id="main"
            class="shell page"
            data-ott-section
        >
            <div class="page-heading">
                <p class="eyebrow">
                    ON YOUR SCREEN
                </p>
                <h1>
                    오늘은, 집에서 한 편.
                </h1>
                <p class="muted">
                    이용 중인 OTT에서 볼 수 있는 영화를 찾아보세요.
                </p>
            </div>
            <div
                class="provider-tabs"
                th:fragment="providers"
                role="group"
                aria-label="OTT 서비스 선택"
            >
                <button
                    type="button"
                    data-provider="8"
                    aria-pressed="true"
                >
                    Netflix
                </button>
                <button
                    type="button"
                    data-provider="337"
                    aria-pressed="false"
                >
                    Disney+
                </button>
                <button
                    type="button"
                    data-provider="356"
                    aria-pressed="false"
                >
                    TVING
                </button>
                <button
                    type="button"
                    data-provider="309"
                    aria-pressed="false"
                >
                    Wavve
                </button>
                <button
                    type="button"
                    data-provider="97"
                    aria-pressed="false"
                >
                    Watcha
                </button>
            </div>
            <div class="result-bar">
                <span>
                    한국 구독 서비스 기준 · 인기순
                </span>
                <span>
                    제공 여부는 서비스 사정에 따라 달라질 수 있습니다.
                </span>
            </div>
            <div
                class="movie-grid"
                data-ott-results
                aria-live="polite"
            >
                <p class="loading">
                    영화를 불러오는 중입니다.
                </p>
            </div>
            <div class="actions" style="justify-content:center;margin-top:34px">
                <button
                    type="button"
                    class="btn"
                    data-ott-more
                    hidden
                >
                    영화 더 보기
                </button>
            </div>
        </main>
        <footer th:replace="~{fragments/layout :: footer}">
        </footer>
        <script src="/js/auth-header.js?v=20260915-3">
        </script>
        <script src="/js/catalog.js?v=20260915-3">
        </script>
    </body>
</html>
