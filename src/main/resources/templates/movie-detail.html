<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/layout :: head('영화 상세')}">
    </head>
    <body class="ml-app">
        <th:block th:replace="~{fragments/layout :: header}">
        </th:block>
        <main id="main" th:data-movie-id="${movie.id}">
            <section class="detail-banner">
                <img
                    class="detail-bg"
                    th:if="${!#strings.isEmpty(movie.backdropUrl)}"
                    th:src="${movie.backdropUrl}"
                    alt=""
                >
                <div class="shell">
                    <div class="breadcrumb">
                        <a href="/movies">
                            영화
                        </a>
                        /
                        <span th:text="${movie.title}">
                            영화 상세
                        </span>
                    </div>
                    <div class="detail-layout">
                        <img
                            class="detail-poster"
                            th:src="${movie.posterUrl}"
                            th:alt="${movie.title} + ' 포스터'"
                            data-poster
                        >
                        <div class="detail-info">
                            <div class="chips">
                                <span
                                    class="badge"
                                    th:each="genre : ${movie.genres}"
                                    th:text="${genre}"
                                >
                                </span>
                            </div>
                            <h1 th:text="${movie.title}">
                                영화 제목
                            </h1>
                            <p class="muted small" th:text="${movie.originalTitle}">
                            </p>
                            <div class="detail-meta">
                                <span
                                    th:text="${#strings.isEmpty(movie.releaseDate) ? '개봉일 정보 없음' : movie.releaseDate}"
                                >
                                </span>
                                <span
                                    th:if="${movie.runtime != null and movie.runtime > 0}"
                                    th:text="${movie.runtime} + '분'"
                                >
                                </span>
                                <span th:text="${movie.certification}">
                                </span>
                            </div>
                            <div class="detail-scores">
                                <div class="score-block">
                                    <strong>
                                        ★
                                        <span
                                            th:text="${movie.voteAverage != null ? #numbers.formatDecimal(movie.voteAverage,1,1) : '—'}"
                                        >
                                            —
                                        </span>
                                    </strong>
                                    <small>
                                        TMDB · 10점 만점
                                    </small>
                                </div>
                                <div class="score-block">
                                    <strong>
                                        ★
                                        <span data-average-rating>
                                            —
                                        </span>
                                    </strong>
                                    <small>
                                        movieLife · 5점 만점 ·
                                        <span data-review-count>
                                            —
                                        </span>
                                        명
                                    </small>
                                </div>
                            </div>
                            <div class="actions">
                                <button
                                    type="button"
                                    class="favorite-toggle favorite-full"
                                    th:data-favorite="${movie.id}"
                                    th:data-title="${movie.title}"
                                    aria-pressed="false"
                                    data-full-label
                                >
                                    ♡ 찜하기
                                </button>
                                <a
                                    class="btn btn-primary"
                                    th:href="@{/review(movieId=${movie.id})}"
                                    data-review-link
                                >
                                    리뷰 작성하기 ↗
                                </a>
                                <a class="btn btn-ghost" href="#reviews">
                                    리뷰 보기
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <div class="shell detail-body">
                <div>
                    <section>
                        <h2>
                            줄거리
                        </h2>
                        <p
                            class="overview"
                            th:text="${#strings.isEmpty(movie.overview) ? '아직 등록된 줄거리 정보가 없습니다.' : movie.overview}"
                        >
                            줄거리
                        </p>
                    </section>
                    <section class="section" id="reviews">
                        <div class="section-head">
                            <h2>
                                관객들의 감상
                                <span class="muted small" data-review-count>
                                </span>
                            </h2>
                            <label class="small muted">
                                정렬
                                <select
                                    class="input"
                                    id="reviewSort"
                                    style="display:inline-block;width:auto;min-height:36px;padding:5px 10px;margin-left:8px"
                                >
                                    <option value="latest">
                                        최신순
                                    </option>
                                    <option value="high">
                                        별점 높은순
                                    </option>
                                    <option value="low">
                                        별점 낮은순
                                    </option>
                                </select>
                            </label>
                        </div>
                        <div
                            class="review-list"
                            id="movieReviews"
                            aria-live="polite"
                        >
                            <p class="loading">
                                리뷰를 불러오는 중입니다.
                            </p>
                        </div>
                    </section>
                </div>
                <aside class="detail-sidebar">
                    <div class="panel">
                        <dl class="facts">
                            <div>
                                <dt>
                                    감독
                                </dt>
                                <dd th:text="${movie.director}">
                                </dd>
                            </div>
                            <div>
                                <dt>
                                    제작 국가
                                </dt>
                                <dd
                                    th:text="${#lists.isEmpty(movie.productionCountries) ? '정보 없음' : #strings.listJoin(movie.productionCountries, ', ')}"
                                >
                                </dd>
                            </div>
                            <div>
                                <dt>
                                    주요 출연진
                                </dt>
                                <dd
                                    th:text="${#lists.isEmpty(movie.cast) ? '정보 없음' : #strings.listJoin(movie.cast, ', ')}"
                                >
                                </dd>
                            </div>
                            <div>
                                <dt>
                                    한국 OTT · 대여 · 구매
                                </dt>
                                <dd>
                                    <div class="chips">
                                        <span
                                            class="badge"
                                            th:each="provider : ${movie.ottProviders}"
                                            th:text="${provider}"
                                        >
                                        </span>
                                    </div>
                                    <span th:if="${#lists.isEmpty(movie.ottProviders)}">
                                        등록된 시청 정보가 없습니다.
                                    </span>
                                    <p class="muted small" style="margin-top:10px">
                                        구독 포함 여부와 가격은 각 서비스에서 확인해 주세요.
                                    </p>
                                </dd>
                            </div>
                        </dl>
                    </div>
                </aside>
            </div>
        </main>
        <footer th:replace="~{fragments/layout :: footer}">
        </footer>
        <script src="/js/auth-header.js?v=20260915-3">
        </script>
        <script src="/js/reviews.js?v=20260915-3">
        </script>
    </body>
</html>
