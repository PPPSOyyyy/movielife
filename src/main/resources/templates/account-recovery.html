<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('계정 찾기')}"></head><body class="ml-app"><th:block th:replace="~{fragments/layout :: header}"></th:block><main id="main" class="shell page settings-page"><h1>계정 찾기</h1><nav class="account-tabs"><a class="btn" href="#find-id">아이디 찾기</a><a class="btn" href="#reset-password">비밀번호 찾기</a></nav>
<section id="find-id" class="panel"><h2>아이디 찾기</h2><form id="findIdForm" class="form-stack"><label class="field">이름<input name="name" maxlength="80" required></label><label class="field">이메일<input name="email" type="email" maxlength="254" required></label><p role="status" data-status></p><button class="btn btn-primary">아이디 확인</button></form></section>
<section id="reset-password" class="panel"><h2>비밀번호 찾기</h2><form id="questionForm" class="form-stack"><label class="field">아이디<input name="userId" maxlength="20" required></label><p role="status" data-status></p><button class="btn btn-primary">보안 질문 확인</button></form>
<form id="answerForm" class="form-stack" hidden><h3 id="recoveryQuestion"></h3><label class="field">보안 질문 답변<input name="answer" type="password" maxlength="200" required></label><p role="status" data-status></p><button class="btn btn-primary">답변 확인</button></form>
<form id="resetForm" class="form-stack" hidden><label class="field">새 비밀번호<input name="password" type="password" minlength="8" maxlength="50" autocomplete="new-password" required></label><label class="field">새 비밀번호 확인<input name="passwordConfirm" type="password" minlength="8" maxlength="50" autocomplete="new-password" required></label><p>영문·숫자·특수문자 포함 8~50자, 공백 제외, 최대 72바이트</p><p role="status" data-status></p><button class="btn btn-primary">새 비밀번호 설정</button></form><a href="/login">로그인으로 돌아가기</a></section></main><footer th:replace="~{fragments/layout :: footer}"></footer><script src="/js/auth-header.js"></script><script src="/js/account.js?v=upgrade20"></script><script src="/js/account-management.js?v=upgrade20"></script></body></html>
