<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${movie.title} + ' | movieLife'">영화 상세정보 | movieLife</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --black: #000000; --red: #D92234; --white: #ffffff; --gray-100: #f5f5f5; --gray-300: #cccccc; --gray-500: #777777; --gray-700: #333333; }
        html { scroll-behavior: smooth; }
        body { min-height: 100vh; background: radial-gradient(circle at 70% 20%, rgba(217, 34, 52, 0.12), transparent 30%), #000000; color: var(--white); font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif; line-height: 1.5; }
        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; cursor: pointer; }

        /* HEADER */
        .header { position: fixed; top: 0; left: 0; z-index: 1000; width: 100%; height: 76px; display: flex; align-items: center; padding: 0 6%; background: rgba(0, 0, 0, 0.94); border-bottom: 1px solid rgba(255,255,255,0.07); backdrop-filter: blur(10px); }
        .logo { display: flex; align-items: center; width: 145px; flex-shrink: 0; }
        .logo img { display: block; width: 145px; height: auto; }
        .nav { display: flex; align-items: center; gap: 30px; margin-left: 45px; }
        .nav a { position: relative; color: #bdbdbd; font-size: 14px; font-weight: 500; transition: 0.25s; }
        .nav a:hover, .nav a.active { color: white; font-weight: 700; }
        .nav a.active::after { content: ""; position: absolute; left: 0; bottom: -9px; width: 100%; height: 2px; background: var(--red); }
        .header-right { display: flex; align-items: center; gap: 10px; margin-left: auto; }
        .login-button { padding: 9px 18px; border: 1px solid #444; border-radius: 5px; background: transparent; color: white; font-size: 12px; }
        .signup-button { padding: 9px 18px; border: 1px solid var(--red); border-radius: 5px; background: var(--red); color: white; font-size: 12px; }

        /* MAIN */
        .movie-detail { max-width: 1150px; margin: 0 auto; padding: 130px 30px 100px; }
        .back-button { display: inline-flex; align-items: center; gap: 7px; margin-bottom: 25px; color: #777; font-size: 12px; transition: 0.2s; }
        .back-button:hover { color: white; }

        .movie-main { display: grid; grid-template-columns: 300px 1fr; gap: 55px; padding-bottom: 55px; border-bottom: 1px solid #222; }

        /* 포스터 */
        .poster-wrapper { width: 100%; }
        .movie-poster { position: relative; width: 100%; aspect-ratio: 2 / 3; overflow: hidden; border-radius: 7px; background: #1a1a1a; box-shadow: 0 25px 60px rgba(0,0,0,0.7); }
        .movie-poster img { width: 100%; height: 100%; display: block; object-fit: cover; }

        /* 영화 정보 */
        .movie-info { display: flex; flex-direction: column; justify-content: center; }
        .movie-label { display: inline-block; margin-bottom: 12px; color: var(--red); font-size: 11px; font-weight: 700; letter-spacing: 2px; }
        .movie-title { margin-bottom: 10px; font-size: 42px; line-height: 1.15; letter-spacing: -2.5px; }
        .movie-original-title { margin-bottom: 25px; color: #555; font-size: 12px; }

        /* 평점 */
        .rating-box { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
        .star { color: #f3c54e; font-size: 24px; }
        .rating-score { font-size: 24px; font-weight: 700; }
        .rating-text { color: #666; font-size: 11px; }

        /* 메타 정보 */
        .movie-meta { display: grid; grid-template-columns: 90px 1fr; row-gap: 13px; max-width: 550px; padding-top: 22px; border-top: 1px solid #222; }
        .meta-label { color: #666; font-size: 11px; }
        .meta-value { color: #ccc; font-size: 12px; }

        /* 버튼 */
        .movie-actions { display: flex; gap: 9px; margin-top: 30px; }
        .action-button { height: 43px; padding: 0 20px; border-radius: 5px; font-size: 12px; font-weight: 600; }
        .favorite-button { border: 1px solid #444; background: transparent; color: white; }
        .favorite-button:hover { border-color: var(--red); color: var(--red); }
        .review-button { border: none; background: var(--red); color: white; }
        .review-button:hover { background: #ed3043; }

        /* 상세 섹션 (줄거리) */
        .detail-section { padding-top: 50px; }
        .section-title { margin-bottom: 18px; font-size: 21px; letter-spacing: -1px; }
        .section-label { margin-bottom: 7px; color: var(--red); font-size: 10px; font-weight: 700; letter-spacing: 2px; }
        .story { padding: 25px; border: 1px solid #252525; border-radius: 7px; background: #101010; }
        .story p { color: #999; font-size: 13px; line-height: 2; }

        .footer { padding: 30px 6%; border-top: 1px solid #181818; text-align: center; color: #444; font-size: 10px; }

        @media (max-width: 900px) {
            .movie-main { grid-template-columns: 240px 1fr; gap: 35px; }
            .movie-title { font-size: 35px; }
        }
        @media (max-width: 700px) {
            .nav, .login-button, .signup-button { display: none; }
            .movie-main { grid-template-columns: 1fr; gap: 35px; }
            .poster-wrapper { max-width: 280px; margin: 0 auto; }
            .movie-title { font-size: 32px; }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <a th:href="@{/}" class="logo">
            <img src="/images/logo.png" alt="movieLife">
        </a>
        <nav class="nav">
            <a th:href="@{/}">홈</a>
            <a th:href="@{/movie-recommend}" class="active">영화추천</a>
            <a th:href="@{/mypage}">마이페이지</a>
        </nav>
        <div class="header-right">
            <a th:href="@{/member/login}" class="login-button">로그인</a>
            <a th:href="@{/member/signup}" class="signup-button">회원가입</a>
        </div>
    </header>

    <!-- MAIN -->
    <main class="movie-detail">

        <!-- 뒤로가기 -->
        <a th:href="@{/movie-recommend}" class="back-button">
            ← 영화 추천 목록으로
        </a>

        <!-- 영화 메인 정보 -->
        <section class="movie-main">
            <!-- 포스터 -->
            <div class="poster-wrapper">
                <div class="movie-poster">
                    <img th:src="${movie.posterPath}" alt="영화 포스터">
                </div>
            </div>

            <!-- 영화 정보 -->
            <div class="movie-info">
                <div class="movie-label">MOVIE INFORMATION</div>
                
                <!-- 영화 제목 -->
                <h1 class="movie-title" th:text="${movie.title}">영화 제목</h1>

                <!-- 평점 -->
                <div class="rating-box">
                    <span class="star">★</span>
                    <span class="rating-score" th:text="${movie.voteAverage}">0.0</span>
                    <span class="rating-text">TMDB 사용자 평점</span>
                </div>

                <!-- 기본 영화 정보 -->
                <div class="movie-meta">
                    <span class="meta-label">영화 ID</span>
                    <span class="meta-value" th:text="${movie.id}">000</span>

                    <span class="meta-label">개봉일</span>
                    <span class="meta-value" th:text="${movie.releaseDate}">2026-00-00</span>
                </div>

                <!-- 버튼 -->
                <div class="movie-actions">
                    <button type="button" class="action-button favorite-button">♡ 찜하기</button>
                    <button type="button" class="action-button review-button">⭐ 평점 남기기</button>
                </div>
            </div>
        </section>

        <!-- 줄거리 -->
        <section class="detail-section">
            <div class="section-label">STORY</div>
            <h2 class="section-title">줄거리</h2>
            <div class="story">
                <p th:text="${movie.overview}">
                    등록된 줄거리 정보가 없습니다.
                </p>
            </div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="footer">
        © 2026 movieLife. All Rights Reserved.
    </footer>

</body>
</html>
